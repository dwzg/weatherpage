name: Retrain the nowcasts

# The models are fitted to years of ten-minute observations from the German
# weather service's stations nearest the balcony — the same three things the
# balcony measures, labelled by the rain gauge beside them — and then scored
# against the balcony's own archive before either may ship. Once a week is
# often enough to keep up with the archive and rare enough to stay reviewable
# in the commit log.
#
# Two come out of one run: rain, labelled by those gauges, and sky, labelled
# by ERA5 cloud cover. They share a feature vector but are gated
# independently, so a run that ships one and refuses the other is working as
# intended.
#
# The run downloads the stations' files from opendata.dwd.de every time and
# deliberately caches nothing: which stations they are says roughly where
# the balcony is, and an Actions cache is readable by more than this job.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Ship the model even if it does not clear the gates"
        type: boolean
        default: false

# One at a time: two runs would race on the same commit to main.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Five stations' worth of downloads, a few hundred thousand station-hours
    # through app.features, and some thirty tree fits. About half an hour.
    timeout-minutes: 90

    permissions:
      contents: write   # to commit a new model
      actions: write    # to start the deploy it cannot trigger by pushing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            requirements-dev.txt

      - name: Install training dependencies
        run: pip install -r ml/requirements.txt -r requirements-dev.txt

      # The station's coordinates are not in the repository — ml/train.py
      # refuses to guess, so an unset secret fails the run rather than
      # training on some other place's stations. Nothing the trainer prints
      # says which stations it chose: this log is public.
      - name: Fit the model
        env:
          APP_URL: ${{ secrets.APP_URL }}
          # /api/weather/export is behind the API key: it is the one endpoint
          # that hands back the raw archive rather than a chart-sized summary.
          API_KEY: ${{ secrets.API_KEY }}
          STATION_LATITUDE: ${{ secrets.STATION_LATITUDE }}
          STATION_LONGITUDE: ${{ secrets.STATION_LONGITUDE }}
        # `shell: bash` is what adds pipefail. Without it the runner's default
        # `bash -e` reports tee's exit status, so a trainer that refused to
        # write a model failing its self-check would show a green tick.
        shell: bash
        run: python -u ml/train.py ${{ inputs.force && '--force' || '' }} | tee training.log

      # Two models come out of one run and are gated separately, so either,
      # both or neither may have moved. Anything that changed is committed
      # together; nothing changing is a normal outcome.
      #
      # app/verification.json is in this list but is NOT gated: it scores the
      # model already deployed against the prediction log, so it moves on
      # almost every run — including the runs where no candidate ships, which
      # is exactly when a stale verification would be most misleading.
      - name: Did anything change?
        id: changed
        run: |
          # `git status`, not `git diff`: the first sky model ever fitted is
          # an untracked file, and git diff cannot see those. Detecting it
          # with diff would report "no change", skip the commit and throw the
          # model away — on that run and on every run after it. The same is
          # true of the first verification.
          if [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No candidate cleared its gates, and the verification is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- $TRACKED
          fi
        env:
          TRACKED: app/model.json app/sky_model.json app/verification.json

      # A model is data the app trusts, so it goes through the same checks a
      # human's change would before it is allowed anywhere near production.
      - name: Test against the new model
        if: steps.changed.outputs.changed == 'true'
        run: |
          ruff check .
          pytest -q

      - name: Commit the new model
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Retrain the nowcasts"
            echo
            echo "Fitted by .github/workflows/retrain.yml to the weather service's"
            echo "stations nearest the balcony: the rain model against their rain"
            echo "gauges, the sky model against observed cloud cover. Each replaced"
            echo "what was shipped only by clearing its own gates in ml/train.py,"
            echo "on a held-out year and on the balcony's own archive; the scores"
            echo "and the baselines they were compared against are in each file"
            echo "under metadata."
            echo
            echo "app/verification.json is refreshed every run regardless: it"
            echo "scores the model already deployed against the prediction log,"
            echo "which is a different question from whether to ship a new one."
            echo
            sed -n '/── rain/,$p' training.log | head -n 40
          } > "$RUNNER_TEMP/commit-message.txt"
          # `git add` is fatal on a path that does not exist, and a run
          # before the sky model has ever cleared its gates has only one file.
          for artefact in app/model.json app/sky_model.json app/verification.json; do
            [ -e "$artefact" ] && git add "$artefact"
          done
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push origin HEAD:main

      # GITHUB_TOKEN pushes do not start workflows, so ask for the deploy.
      - name: Deploy the new model
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Summary
        if: always()
        run: |
          {
            echo '### Nowcast retraining'
            echo
            if [ "${{ steps.changed.outputs.changed }}" = "true" ]; then
              echo 'A new model was committed and deployed.'
            else
              echo 'The shipped model was kept.'
            fi
            echo
            echo '```'
            cat training.log 2>/dev/null || echo 'no training output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
