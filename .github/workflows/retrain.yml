name: Retrain the nowcasts

# The models are fitted from the station's own readings against observed
# weather, so they get better as the archive grows. Once a week is often
# enough to matter and rare enough to stay reviewable in the commit log.
#
# Two come out of one run: rain, labelled by observed precipitation, and sky,
# labelled by observed cloud cover. They share a feature vector and a replay
# but are gated independently, so a run that ships one and refuses the other
# is working as intended. The sky model in particular needs a year or so of
# archive before it clears — on a single season it is measurably worse than
# quoting the long-run average, and the gates catch that.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Ship the model even if it does not clear the gates"
        type: boolean
        default: false

# One at a time: two runs would race on the same commit to main.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to commit a new model
      actions: write    # to start the deploy it cannot trigger by pushing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            requirements-dev.txt

      - name: Install training dependencies
        run: pip install -r ml/requirements.txt -r requirements-dev.txt

      # The station's coordinates are not in the repository — ml/train.py
      # refuses to guess, so an unset secret fails the run rather than
      # labelling the data with some other place's rain.
      - name: Fit the model
        env:
          APP_URL: ${{ secrets.APP_URL }}
          # /api/weather/export is behind the API key: it is the one endpoint
          # that hands back the raw archive rather than a chart-sized summary.
          API_KEY: ${{ secrets.API_KEY }}
          STATION_LATITUDE: ${{ secrets.STATION_LATITUDE }}
          STATION_LONGITUDE: ${{ secrets.STATION_LONGITUDE }}
        run: python ml/train.py ${{ inputs.force && '--force' || '' }} | tee training.log

      # Two models come out of one run and are gated separately, so either,
      # both or neither may have moved. Anything that changed is committed
      # together; nothing changing is a normal outcome.
      - name: Did either model change?
        id: changed
        run: |
          # `git status`, not `git diff`: the first sky model ever fitted is
          # an untracked file, and git diff cannot see those. Detecting it
          # with diff would report "no change", skip the commit and throw the
          # model away — on that run and on every run after it.
          if [ -z "$(git status --porcelain -- app/model.json app/sky_model.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No candidate cleared its gates, or both matched what is shipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- app/model.json app/sky_model.json
          fi

      # A model is data the app trusts, so it goes through the same checks a
      # human's change would before it is allowed anywhere near production.
      - name: Test against the new model
        if: steps.changed.outputs.changed == 'true'
        run: |
          ruff check .
          pytest -q

      - name: Commit the new model
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Retrain the nowcasts"
            echo
            echo "Fitted by .github/workflows/retrain.yml from the station's own"
            echo "readings: the rain model against observed rainfall, the sky model"
            echo "against observed cloud cover. Each replaced what was shipped only"
            echo "by clearing its own gates in ml/train.py, which are measured"
            echo "walk-forward; the scores and the baselines they were compared"
            echo "against are in each file under metadata."
            echo
            sed -n '/walk-forward/,$p' training.log | head -n 24
          } > "$RUNNER_TEMP/commit-message.txt"
          # `git add` is fatal on a path that does not exist, and a run
          # before the sky model has ever cleared its gates has only one file.
          for model in app/model.json app/sky_model.json; do
            [ -e "$model" ] && git add "$model"
          done
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push origin HEAD:main

      # GITHUB_TOKEN pushes do not start workflows, so ask for the deploy.
      - name: Deploy the new model
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Summary
        if: always()
        run: |
          {
            echo '### Nowcast retraining'
            echo
            if [ "${{ steps.changed.outputs.changed }}" = "true" ]; then
              echo 'A new model was committed and deployed.'
            else
              echo 'The shipped model was kept.'
            fi
            echo
            echo '```'
            cat training.log 2>/dev/null || echo 'no training output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
