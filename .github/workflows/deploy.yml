name: Build and Deploy to GHCR

on:
  push:
    branches: [main]
  # The weekly retraining job commits a new model with GITHUB_TOKEN, and
  # GitHub deliberately does not let that push start another workflow.
  # Without this, a retrained model would sit on main undeployed.
  workflow_dispatch:

# Two deploys racing would leave whichever image finished last, which may not
# be the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default buildx driver is "docker", which cannot export a build
      # cache; without this the build fails before it starts on "Cache export
      # is not supported for the docker driver", the webhook step is skipped,
      # and the old image keeps serving with nothing on the PR to show it.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Clean up BEFORE pushing, never after: this deletes untagged package
      # versions, and the image pushed moments earlier can legitimately have
      # some. Running it last raced the deploy and won.
      - name: Delete old untagged package versions
        continue-on-error: true
        uses: minish144/delete-untagged-action@v2
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          personal-account: true

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with the commit SHA as well as latest, so a bad deploy can be
          # rolled back by pinning the previous SHA in the compose file.
          tags: |
            ghcr.io/${{ github.repository_owner }}/weatherpage:latest
            ghcr.io/${{ github.repository_owner }}/weatherpage:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Push one plain manifest, not an index. The container driver that
          # setup-buildx-action gives us attaches a provenance attestation by
          # default, which turns the tag into an OCI index whose children are
          # untagged package versions — and untagged versions get deleted
          # here, leaving the tag pointing at manifests that no longer exist.
          # Portainer then fails to pull with "manifest unknown" while the
          # tag itself still resolves. Nothing consumes the attestation.
          provenance: false
          sbom: false

      # Arcane deploys hosts/vps/weatherpage from github.com/dwzg/homelab: pinning the new
      # tag there is the deployment (live within ~5 minutes). Roll back by reverting that commit.
      - name: Deploy via the homelab repo
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          STACK: weatherpage
          IMAGE: ghcr.io/dwzg/weatherpage
          TAG: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::notice::No HOMELAB_DEPLOY_KEY secret, so nothing was deployed"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/homelab && chmod 600 ~/.ssh/homelab
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/homelab -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 git@github.com:dwzg/homelab.git "$RUNNER_TEMP/homelab"
          cd "$RUNNER_TEMP/homelab"
          file="hosts/vps/$STACK/compose.yaml"
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$file"
          if git diff --quiet; then echo "$file already runs $TAG"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "deploy($STACK): $TAG" -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
