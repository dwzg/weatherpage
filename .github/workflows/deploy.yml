name: Build and Deploy to GHCR

on:
  push:
    branches: [main]
  # The weekly retraining job commits a new model with GITHUB_TOKEN, and
  # GitHub deliberately does not let that push start another workflow.
  # Without this, a retrained model would sit on main undeployed.
  workflow_dispatch:

# Two deploys racing would leave whichever image finished last, which may not
# be the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default buildx driver is "docker", which cannot export a build
      # cache; without this the build fails before it starts on "Cache export
      # is not supported for the docker driver", the webhook step is skipped,
      # and the old image keeps serving with nothing on the PR to show it.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with the commit SHA as well as latest, so a bad deploy can be
          # rolled back by pinning the previous SHA in the compose file.
          tags: |
            ghcr.io/${{ github.repository_owner }}/weatherpage:latest
            ghcr.io/${{ github.repository_owner }}/weatherpage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer webhook
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK_URL }}

      - name: Delete old untagged package versions
        uses: minish144/delete-untagged-action@v2
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          personal-account: true
